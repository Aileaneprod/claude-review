# Default configuration for claude-review.
#
# THIS FILE IS THE SOURCE OF TRUTH for every key in it. Precedence:
#
#     config/defaults.yml  <  workflow inputs  <  the repo's .claude-review.yml
#
# A repo overrides any of these with a `.claude-review.yml` at its root; repo
# values win. See templates/.claude-review.yml for a documented example.
#
# Do not copy a value here into a `default:` in review.yml's inputs. GitHub
# substitutes an omitted input's default, so an input carrying one shadows this
# file permanently — which is what happened to five of these keys, while
# docs/TUNING.md told people to edit here. Inputs that mirror a key below
# default to empty, and scripts/test/cases/collect-inputs.sh enforces it.
#
# IMPORTANT — this file is parsed by a deliberately small YAML reader (see
# scripts/resolve-config.sh). Only two shapes are supported:
#
#     key: scalar
#     key:
#       - list item
#       - list item
#
# No nested mappings, no flow collections (`[a, b]`), no multi-line scalars, no
# anchors. Anything else is a hard error, not a silent misparse. This keeps the
# pipeline dependent on nothing beyond stock python3. See docs/ARCHITECTURE.md.

# Which prompt profile to use. `auto` detects from repo contents.
# Explicit values: python-fastapi, node-typescript, react-native, n8n, postgres,
# generic — or several, comma-separated (e.g. node-typescript,postgres).
profile: auto

# Model ID. Empty means "let claude-code-action choose its own default", and for
# a long time that was the right answer. It is pinned now for two reasons.
#
# The first is that an empty value is not neutral: it silently hands the choice
# of reviewer to whoever sets the action's default, and a change there alters
# every review in every repository with no commit here. Measured on 2026-09-22,
# the default was claude-sonnet-5.
#
# The second is that this is a deliberate upgrade, to claude-opus-5-5: newer
# than claude-opus-5 and cheaper per token ($4 / $20 per MTok against $5 / $25).
# It is only usable because claude-code-action@v1 now pins Claude Code 2.1.281.
# Its earlier pin, 2.1.278, rejected claude-opus-5-5 before any request
# (`unrecognized_model`, on every fixture of the live eval, 2026-09-23), and
# this file shipped claude-opus-5 in the meantime. The model must be one the
# action's pinned CLI KNOWS: run the live eval before changing it —
# .github/workflows/eval.yml installs the same CLI the action does.
#
# Opus still costs twice Sonnet per token ($2 / $10), and reviews run on a
# subscription whose limit was hit on 2026-09-17, 2026-09-22 and — on
# claude-opus-5, at about $4 a review — again on 2026-09-23. Expect it. The
# fallback credential in review.yml exists for that, and so does lowering
# `effort` below.
#
# The value is validated as an identifier by resolve-config.sh — it becomes a
# command-line argument, so it cannot be allowed to carry another one. Model IDs
# change; see docs/TUNING.md before editing.
model: claude-opus-5-5

# Reasoning effort: low, medium, high, xhigh, max. `medium` is
# claude-opus-5-5's own default, written down so it is a decision and not an
# accident — an empty value would follow whatever the model's default becomes.
#
# Chosen for cost, on evidence. At `xhigh` on claude-opus-5 a korbyx review
# cost $3.60 to $4.90 against about $1.20 on Sonnet 5, and the subscription's
# limit was reached within hours of the switch (2026-09-23). `medium` on the
# newer, cheaper model is the bet that quality holds for a fraction of that;
# the live eval is what says whether it does. Raise to `high`, then `xhigh`,
# only if it shows findings being missed. There is no `ultra` level: that is a
# Claude Code session mode, and its effort is `xhigh`.
effort: medium

# Maximum agentic turns for a single review. The main lever on cost per review.
#
# It is a CEILING, not a target. A review that finishes in 24 turns costs 24
# turns whatever this says, and the number never reaches the model — it becomes
# `--max-turns` on the CLI and nothing else. Raising it costs nothing except on
# the runs that would otherwise have been cut off.
#
# Being cut off is expensive, and it is expensive twice over:
#
#   * a review that stops at the ceiling costs the same as one that finishes
#     and delivers nothing — `error_max_turns`, and the author gets a notice.
#   * a review that FINISHES past the ceiling is also thrown away. The action
#     checks `num_turns` after the run and fails the step even when the CLI
#     reported success. Aileaneprod/korbyx#110, run 34058925818: subtype
#     success, terminal_reason completed, 43 turns, $0.87, announced as "AI
#     review unavailable". classify-run.sh now rescues that case, but the
#     honest answer is to stop provoking it.
#
# Measured history, all of it evidence rather than guesswork:
#
#   * 20 killed reviews on two independent repositories. Aileaneprod/korbyx,
#     four reviews on one PR: two died at 20 turns for $0.86 and $1.03 with
#     nothing posted. This repository's own first self-review (PR #1):
#     `error_max_turns` at 21 turns, $0.74, nothing posted.
#   * 40 held for a while and then stopped holding. korbyx#110 reported 43,
#     the first review to run with the Linear ticket in its prompt — a longer
#     prompt and one more file to read.
#
# A turn is mostly one file read, and a real review reads the changed files plus
# the conventions around them — AGENTS.md, the ADRs, the ticket, the config the
# change touches — before it can conclude anything. 60 is chosen for headroom
# over the 43 that has actually been seen, not calculated. At the measured 7.3 s
# per turn it is about 7 minutes; even at a pessimistic 20 s it stays inside the
# reviewer step's 30-minute timeout. Lower it if quota gets tight, knowing
# exactly what it buys and what it risks.
max_turns: 60

# Hard cap on inline comments per review. Beyond this the reviewer keeps the
# highest-severity findings and says how many it dropped.
max_findings: 12

# Above this many changed lines the review degrades to triage mode: only
# highest-risk files are read, and the summary says the review was partial.
max_diff_lines: 2000

# Language for the reviewer's output — findings and the summary comment.
# Empty means: write in the language the repository itself uses. Set it
# explicitly (e.g. "français", "English") when a team wants one regardless of
# what the code comments happen to be in. The reviewer still reads code in any
# language; this only governs what it writes.
language: ""

# When true, a blocking finding fails the check run. Off by default — an AI
# reviewer should not have merge authority.
fail_on_blocking: false

# Paths excluded from review. Glob syntax: `*` matches within a path segment,
# `**` matches across segments, `?` matches one character.
exclude_paths:
  - "**/*.lock"
  - "**/*.min.js"
  - "**/*.min.css"
  - "**/*.map"
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "poetry.lock"
  - "Pipfile.lock"
  - "uv.lock"
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
  - "**/__snapshots__/**"
  - "**/*.snap"
  - "**/migrations/**/*.sql"
  - "**/*.svg"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.ico"
  - "**/*.webp"
  - "**/*.pdf"
  - "**/*.woff"
  - "**/*.woff2"
  - "**/*.ttf"
  - "**/*.eot"
  - "**/*.pb.go"
  - "**/*_pb2.py"
  - "**/*.generated.*"
  - "**/generated/**"
  - "**/CHANGELOG.md"
