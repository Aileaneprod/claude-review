# Dogfooding: claude-review reviews its own pull requests.
#
# This is the same wrapper every project repo gets (templates/wrapper.yml), with
# one difference — it calls the reusable workflow by local path rather than by
# `owner/claude-review/...@v1`. A local reference always runs the version on the
# PR branch, so a change to review.yml or to the prompts is exercised by the
# very pull request that proposes it.
#
# If a prompt change makes the reviewer noisy, this is where you find out first.

name: Self review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      # Lets the review publish an `AI review outcome` check run, `neutral`,
      # when it could not review this push. Without it the job's own check
      # goes green either way, and a review that never ran is indistinguishable
      # from one that ran and found nothing — which is how Aileaneprod/korbyx#131
      # was merged unreviewed. review.yml degrades quietly if this line is
      # absent: the review still happens, only the grey check does not.
      checks: write
    uses: ./.github/workflows/review.yml
    with:
      # Load scripts and prompts from THIS pull request's head, not from the
      # released `v1` tag. Without this the workflow logic under review would
      # run against the previously-shipped prompts, which is not dogfooding.
      tooling_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
