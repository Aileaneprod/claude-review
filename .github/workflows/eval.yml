# Prompt regression harness.
#
# workflow_dispatch ONLY — never on push, never on pull_request. A live run
# calls the model once per fixture and spends Claude subscription quota, so it
# must always be a deliberate act.
#
# Stub mode (the default) replays committed responses and costs nothing, so it
# is safe to run any time to check that the harness itself still works.
#
# A run here is the AUTHORITATIVE baseline: the runner is clean, with no local
# CLAUDE.md, MCP servers or hooks to perturb the result. A local
# `./eval/run-eval.sh --live` is advisory only — see docs/TUNING.md.

name: Prompt eval

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Call the real model (spends subscription quota)"
        type: boolean
        default: false
      fixture:
        description: "Run a single fixture by name (blank = all)"
        type: string
        default: ""
      repeat:
        description: "Reviews per fixture. One live run is one sample; 3 gives rates"
        type: string
        default: "1"
      learnings:
        description: "Lessons injected: blank = prompts/learnings.md, none, or drop:K to leave out lesson K"
        type: string
        default: ""
      min_hit_rate:
        description: "With repeat > 1: share of runs that must find each planted defect (blank = 1)"
        type: string
        default: ""
      max_decoy_rate:
        description: "With repeat > 1: share of runs allowed to hit a decoy (blank = 0)"
        type: string
        default: ""

concurrency:
  group: claude-review-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: ${{ inputs.live && 'Live eval' || 'Stub eval' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Only needed for a live run. This is the single place in the repo that
      # installs anything — the reviewer pipeline itself depends on nothing
      # beyond bash, git, gh and python3, all preinstalled. The eval harness
      # drives the `claude` CLI directly, which has to come from somewhere.
      - name: Install the Claude Code CLI
        if: inputs.live
        # The version claude-code-action@v1 installs for real reviews, read from
        # the action itself (`claudeCodeVersion` in src/entrypoints/run.ts) on
        # every run. It used to be a number written here by hand, and the
        # action bumps its pin every few days: an eval on a different CLI from
        # production can pass on a model or a flag production does not have.
        # That is exactly how claude-opus-5-5 reached a merged PR on 2026-09-23
        # while the production CLI rejected it. No version found fails the
        # step: an eval on a guessed CLI measures nothing.
        run: |
          set -euo pipefail
          version="$(curl -fsSL --retry 3 https://raw.githubusercontent.com/anthropics/claude-code-action/v1/src/entrypoints/run.ts \
            | sed -n 's/.*claudeCodeVersion = "\([0-9][0-9.]*\)".*/\1/p' | head -1)"
          if [ -z "$version" ]; then
            echo "::error title=Unknown CLI version::could not read claudeCodeVersion from claude-code-action@v1"
            exit 1
          fi
          echo "Installing Claude Code ${version}, the version claude-code-action@v1 runs reviews on."
          npm install -g "@anthropic-ai/claude-code@${version}"

      - name: Run the harness
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LIVE: ${{ inputs.live }}
          FIXTURE: ${{ inputs.fixture }}
          REPEAT: ${{ inputs.repeat }}
          LEARNINGS: ${{ inputs.learnings }}
          MIN_HIT_RATE: ${{ inputs.min_hit_rate }}
          MAX_DECOY_RATE: ${{ inputs.max_decoy_rate }}
        run: |
          set -euo pipefail
          args=()
          if [ "$LIVE" = "true" ]; then
            if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
              echo "::error title=Missing secret::A live eval needs CLAUDE_CODE_OAUTH_TOKEN on this repo."
              exit 1
            fi
            args+=(--live)
          fi
          if [ -n "$FIXTURE" ]; then
            args+=(--fixture "$FIXTURE")
          fi
          args+=(--repeat "${REPEAT:-1}")
          case "${LEARNINGS:-}" in
            "")     ;;
            none)   args+=(--learnings none) ;;
            drop:*) args+=(--drop-lesson "${LEARNINGS#drop:}") ;;
            *)      echo "::error title=Bad input::learnings must be blank, none, or drop:K"; exit 1 ;;
          esac
          if [ -n "${MIN_HIT_RATE:-}" ]; then args+=(--min-hit-rate "$MIN_HIT_RATE"); fi
          if [ -n "${MAX_DECOY_RATE:-}" ]; then args+=(--max-decoy-rate "$MAX_DECOY_RATE"); fi
          ./eval/run-eval.sh "${args[@]}" | tee "$RUNNER_TEMP/eval.txt"

      - name: Publish the report
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Prompt eval"
            echo
            echo '```'
            cat "$RUNNER_TEMP/eval.txt" 2>/dev/null || echo "(the harness produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always() && inputs.live
        uses: actions/upload-artifact@v4
        with:
          name: eval-output
          path: eval/.out/
          retention-days: 7
          if-no-files-found: ignore
          # The output directory is HIDDEN — `.out` — and upload-artifact@v4
          # skips hidden files unless told otherwise. So every run of this
          # workflow uploaded an empty artifact and said so in one line nobody
          # reads: "No files were found with the provided path: eval/.out/".
          #
          # The cost was not theoretical. The gate failed on 2026-08-05 with one
          # decoy hit and stayed red for 44 days, because the responses that
          # would have named the false positive were discarded by the step meant
          # to keep them. `if-no-files-found: ignore` is right — a stub run can
          # legitimately produce nothing — and it is also what kept this quiet.
          include-hidden-files: true
