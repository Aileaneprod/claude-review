# AI code review, delegated to the central claude-review repo.
#
# Copy this file into a project repo as .github/workflows/ai-review.yml.
# Nothing needs editing — it already points at Aileaneprod/claude-review.
#
# BY DEFAULT THIS MUST LAND ON THE REPOSITORY'S DEFAULT BRANCH. The Claude
# GitHub App refuses to run when the workflow file differs from the copy on the
# default branch — that is what stops a pull request from rewriting the workflow
# to steal the token. Consequences:
#   * On a repo using a develop/main split, merging this into `develop` alone is
#     not enough; reviews stay silent until it is on the default branch too.
#   * The pull request that ADDS this file never gets reviewed by it. That is
#     expected. Reviews begin on the next pull request.
# The run log says: "Workflow validation failed. The workflow file must exist
# and have identical content to the version on the repository's default branch."
#
# If you cannot put this on the default branch — a repo that develops only on
# `develop`, for instance — set `use_github_app: false` below (or install with
# `--no-github-app`). That makes the reviewer authenticate with this workflow's
# own GITHUB_TOKEN instead of the App, which skips that check entirely. The only
# visible difference is that comments come from github-actions[bot] rather than
# claude[bot]. It also means the Claude GitHub App does not need to be installed
# on the repository at all.
#
# The permissions block MUST live here, in the caller. A reusable workflow can
# only ever downgrade the caller's token, never elevate it — so if these are
# omitted the review job silently loses the ability to comment.
#
# Secrets are never shared between repositories by GitHub. This workflow passes
# CLAUDE_CODE_OAUTH_TOKEN explicitly by name — not `secrets: inherit` — so the
# called workflow receives that one token and nothing else this repo holds. The
# secret must exist on THIS repository (or on the organization that owns it):
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo OWNER/THIS-REPO
#
# Everything else is configured centrally. To override a default for this repo
# only, add a .claude-review.yml at the repo root — see the template alongside
# this file.
#
# Three things are deliberately as they are, so please don't "fix" them:
#
#   * `@v1` is a MOVING TAG, on purpose, and is not pinned to a commit SHA.
#     Reviewers raise this often, so: the whole point of the central
#     reusable-workflow design is that one retag propagates a prompt or workflow
#     fix to every consuming repo at once. SHA-pinning would mean hand-editing
#     the pin in every wrapper on every change, which defeats the architecture.
#     That benefit is not hypothetical: a bug that was silently breaking every
#     review in every repo was FIXED everywhere by one retag, with no wrapper
#     touched. Under SHA pins it would have needed a PR per repo.
#     On the security side: the untrusted input is fork pull requests, and
#     review.yml excludes those with a dedicated guard rather than using
#     pull_request_target. claude-review is controlled by the same person as
#     this repo, so a retag is not a third-party supply-chain event.
#
#   * No `labeled`/`unlabeled` triggers. GitHub cannot filter a trigger by label
#     name, so those types fire on EVERY label change. An unrelated label like
#     "bug" would pass the skip-ai-review check and spend a full review's worth
#     of Claude quota for nothing. The label is honoured on the next push, which
#     is soon enough and free in the meantime.
#   * No `if:` guarding on the secret. The `secrets` context is NOT available in
#     `jobs.<job_id>.if` — only github, inputs, needs and vars are — so
#     `if: secrets.FOO != ''` is a workflow validation error, not a guard.
#     review.yml checks the credential in a step, where `secrets` IS reachable,
#     and stops cheaply with an explanation if it is missing.

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel a review that a newer push has already made obsolete. review.yml
# declares its own concurrency group too, but whether a top-level `concurrency`
# block inside a *called* workflow governs the run is not actually stated
# anywhere in GitHub's documentation — and this is the single biggest quota
# saver in the design, so it is not something to leave to undocumented
# behaviour. Declaring it here, in an ordinary caller workflow, is guaranteed
# to work.
#
# The group name must DIFFER from the one review.yml uses. GitHub's documented
# warning is that if a caller and a called workflow share a group value with
# cancel-in-progress, the workflow already running gets cancelled — so matching
# names here would have the two fighting instead of cooperating.
concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      # Lets the review publish an `AI review outcome` check run, `neutral`,
      # when it could not review this push. Without it the job's own check
      # goes green either way, and a review that never ran is indistinguishable
      # from one that ran and found nothing — which is how Aileaneprod/korbyx#131
      # was merged unreviewed. review.yml degrades quietly if this line is
      # absent: the review still happens, only the grey check does not.
      checks: write
    uses: Aileaneprod/claude-review/.github/workflows/review.yml@v1
    with:
      # true  — authenticate as the Claude GitHub App. Requires this file to be
      #         present, byte-identical, on the repository's DEFAULT branch.
      # false — authenticate with this workflow's own GITHUB_TOKEN instead.
      #         Set false when this file will not be on the default branch.
      # Check which branch is the default before changing this; it is not
      # always `main`. See the header for the full explanation.
      use_github_app: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional. With it, the reviewer reads the Linear ticket this pull
      # request names and checks the change against what the ticket asked for.
      # Without it — the secret simply absent — the reviewer says so and reviews
      # the change on its own terms. Passed BY NAME, like the token above:
      # `secrets: inherit` would hand the called workflow every other secret
      # this repository holds. See docs/SETUP.md step 3d.
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
